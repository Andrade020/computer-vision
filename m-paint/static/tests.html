<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>MathBoard — testes</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #1d2030; color: #e8eaf2; }
    h1 { font-size: 18px; } h2 { font-size: 14px; margin: 18px 0 6px; color: #9aa0b8; }
    table { border-collapse: collapse; font-size: 13px; }
    td, th { border: 1px solid #343a57; padding: 4px 10px; text-align: left; }
    .ok { color: #55efc4; } .fail { color: #ff7675; font-weight: bold; }
    #summary { margin-top: 16px; font-size: 15px; }
  </style>
</head>
<body>
  <h1>MathBoard — testes de módulos puros</h1>
  <div id="out"></div>
  <div id="summary"></div>

  <script type="module">
    import { compile, evalConst, ExprError } from "/js/expr.js";
    import { brownianBridge } from "/js/tools/brownian.js";
    import { lineEndpoint } from "/js/tools/line.js";
    import { circlePoints } from "/js/tools/compass.js";
    import { tickStep, Viewport } from "/js/viewport.js";
    import { makeCurve, sampleCurve } from "/js/plot.js";
    import { toMathObject } from "/js/scene.js";

    const out = document.getElementById("out");
    let pass = 0, fail = 0;

    function section(title) {
      const h = document.createElement("h2");
      h.textContent = title;
      out.appendChild(h);
      const t = document.createElement("table");
      t.innerHTML = "<tr><th>caso</th><th>esperado</th><th>obtido</th><th></th></tr>";
      out.appendChild(t);
      return t;
    }
    function row(table, name, expected, got, ok) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name}</td><td>${expected}</td><td>${got}</td>` +
        `<td class="${ok ? "ok" : "fail"}">${ok ? "✓" : "✗"}</td>`;
      table.appendChild(tr);
      ok ? pass++ : fail++;
    }
    const close = (a, b, eps = 1e-9) => Math.abs(a - b) <= eps;

    // ---- parser: avaliação -------------------------------------------------
    const t1 = section("expr.js — avaliação");
    const cases = [
      ["2x+1", "x", 3, 7],
      ["-x^2", "x", 3, -9],           // precedência: -(x^2)
      ["2^3^2", "x", 0, 512],         // assoc. à direita
      ["sin(pi/2)", "x", 0, 1],
      ["log(e)", "x", 0, 1],
      ["(x+1)(x-2)", "x", 4, 10],     // mult implícita
      ["xsin(x)", "x", Math.PI / 2, Math.PI / 2],
      ["y = x/2", "x", 5, 2.5],       // prefixo opcional
      ["-2^2", "x", 0, -4],
      [".5x", "x", 4, 2],
      // M3: novas funções e constantes
      ["sinh(0)", "x", 0, 0],
      ["cosh(0)", "x", 0, 1],
      ["tanh(0)+atan(1)", "x", 0, Math.PI / 4],
      ["asin(1)", "x", 0, Math.PI / 2],
      ["floor(2.7)+ceil(2.2)", "x", 0, 5],
      ["sign(-8)round(2.5)", "x", 0, -3],
      ["tau", "x", 0, 2 * Math.PI],
      // M3: variável configurável
      ["cos(t)", "t", 0, 1],
      ["x(t) = 2cos(t)", "t", 0, 2],  // prefixo "x(t) =" removido
      ["r = 1+t", "t", 2, 3],
      ["tan(t)", "t", Math.PI / 4, Math.tan(Math.PI / 4)], // 'tan' vs var 't'
    ];
    for (const [src, vr, v, want] of cases) {
      try {
        const got = compile(src, vr)(v);
        row(t1, `${src}  [${vr}=${v}]`, want, got, close(got, want));
      } catch (err) {
        row(t1, `${src}  [${vr}=${v}]`, want, `erro: ${err.message}`, false);
      }
    }
    try {
      row(t1, 'evalConst("2pi")', 2 * Math.PI, evalConst("2pi"), close(evalConst("2pi"), 2 * Math.PI));
    } catch (e) { row(t1, 'evalConst("2pi")', 2 * Math.PI, e.message, false); }

    // ---- parser: erros -----------------------------------------------------
    const t2 = section("expr.js — casos de erro (devem lançar ExprError)");
    for (const src of ["", "2+", "sin()", "foo(x)", "x$", "((x)", "sin x", "t"]) {
      try {
        compile(src); // variável padrão 'x': "t" solto deve falhar
        row(t2, JSON.stringify(src), "ExprError", "não lançou", false);
      } catch (err) {
        const ok = err instanceof ExprError;
        row(t2, JSON.stringify(src), "ExprError", `${err.constructor.name}: ${err.message}`, ok);
      }
    }

    // ---- curvas vivas ------------------------------------------------------
    const t3 = section("plot.js — curvas");
    const vp = new Viewport();
    vp.resize(800, 600);
    vp.setDefaultScale(); // ppu = 40, x ∈ [-10, 10]

    const sinP = sampleCurve(makeCurve("cartesian", { fx: "sin(x)" }, {}), vp);
    row(t3, "sin(x)", "1 ramo", `${sinP.length} ramo(s)`, sinP.length === 1);

    const tanP = sampleCurve(makeCurve("cartesian", { fx: "tan(x)" }, {}), vp);
    row(t3, "tan(x) quebra nas assíntotas", "> 3 ramos", `${tanP.length}`, tanP.length > 3);

    const circ = makeCurve("parametric", { x: "cos(t)", y: "sin(t)", t0: 0, t1: 2 * Math.PI }, {});
    const cp = sampleCurve(circ, vp);
    const flat = cp.flat();
    const radiusOk = flat.every((p) => {
      const m = vp.toMath(p.x, p.y);
      return close(Math.hypot(m.x, m.y), 1, 1e-6);
    });
    row(t3, "paramétrica círculo raio", "1", radiusOk ? "1" : "desviou", radiusOk);
    const first = cp[0][0], last = cp.at(-1).at(-1);
    row(t3, "círculo fecha", "1º ≈ último", "comparado",
        cp.length === 1 && close(first.x, last.x, 0.5) && close(first.y, last.y, 0.5));

    const pol = sampleCurve(makeCurve("polar", { r: "2", t0: 0, t1: 2 * Math.PI }, {}), vp);
    const polOk = pol.flat().every((p) => {
      const m = vp.toMath(p.x, p.y);
      return close(Math.hypot(m.x, m.y), 2, 1e-6);
    });
    row(t3, "polar r=2 é círculo raio 2", "2", polOk ? "2" : "desviou", polOk);

    // ---- cena em coordenadas matemáticas -----------------------------------
    const t4 = section("scene.js — conversão px ↔ matemática (M3)");
    const strokePx = {
      kind: "stroke", color: "#000", width: 4, composite: "source-over",
      paths: [[{ x: 100, y: 100 }, { x: 300, y: 250 }]],
    };
    const sm = toMathObject(strokePx, vp);
    const backOk = sm.paths[0].every((mp, i) => {
      const pp = vp.toPx(mp.x, mp.y);
      return close(pp.x, strokePx.paths[0][i].x, 1e-9) && close(pp.y, strokePx.paths[0][i].y, 1e-9);
    });
    row(t4, "stroke px→math→px", "idêntico", backOk ? "idêntico" : "desviou", backOk);
    row(t4, "largura vira unidades matemáticas", 4 / vp.pxPerUnit, sm.width,
        close(sm.width, 4 / vp.pxPerUnit));
    const wm = toMathObject({ kind: "wipe", x: 40, y: 60, w: 80, h: 20 }, vp);
    const wtl = vp.toPx(wm.x, wm.y);
    row(t4, "wipe px→math→px (canto)", "(40, 60)", `(${wtl.x.toFixed(6)}, ${wtl.y.toFixed(6)})`,
        close(wtl.x, 40, 1e-9) && close(wtl.y, 60, 1e-9));

    // ---- ponte browniana ---------------------------------------------------
    const t5 = section("brownian.js — ponte");
    const A = { x: 100, y: 200 }, B = { x: 500, y: 260 };
    const p1 = brownianBridge(A, B, 42, 0.8);
    row(t5, "pontas fixas", "A e B", "comparado",
        close(p1[0].x, A.x) && close(p1[0].y, A.y)
        && close(p1.at(-1).x, B.x, 1e-6) && close(p1.at(-1).y, B.y, 1e-6));
    const p3 = brownianBridge(A, B, 7, 0);
    const onSegment = p3.every((p) => {
      const cross = (B.x - A.x) * (p.y - A.y) - (B.y - A.y) * (p.x - A.x);
      return Math.abs(cross) < 1e-6;
    });
    row(t5, "σ = 0 é a reta exata", "colinear", onSegment ? "colinear" : "desviou", onSegment);

    // ---- ferramenta de linha (H/V) ------------------------------------------
    const t5b = section("line.js — endpoint travado no eixo dominante");
    const start = { x: 100, y: 100 };
    const eH = lineEndpoint(start, { x: 180, y: 130 }); // dx=80 > dy=30 -> horizontal
    row(t5b, "dx > dy -> horizontal", "(180, 100)", `(${eH.x}, ${eH.y})`,
        eH.x === 180 && eH.y === 100);
    const eV = lineEndpoint(start, { x: 130, y: 180 }); // dy=80 > dx=30 -> vertical
    row(t5b, "dy > dx -> vertical", "(100, 180)", `(${eV.x}, ${eV.y})`,
        eV.x === 100 && eV.y === 180);
    const eTie = lineEndpoint(start, { x: 150, y: 150 }); // empate -> horizontal (>=)
    row(t5b, "dx == dy -> horizontal (empate)", "(150, 100)", `(${eTie.x}, ${eTie.y})`,
        eTie.x === 150 && eTie.y === 100);

    // ---- compasso ------------------------------------------------------------
    const t5c = section("compass.js — círculo");
    const center = { x: 200, y: 150 }, r = 60;
    const pts = circlePoints(center, r, 96);
    const allOnRadius = pts.every((p) => close(Math.hypot(p.x - center.x, p.y - center.y), r, 1e-6));
    row(t5c, "todos os pontos a distância r do centro", "true", allOnRadius, allOnRadius);
    const closes = close(pts[0].x, pts.at(-1).x, 1e-9) && close(pts[0].y, pts.at(-1).y, 1e-9);
    row(t5c, "laço fecha (1º == último)", "true", closes, closes);
    row(t5c, "nº de pontos = n+1", 97, pts.length, pts.length === 97);

    // ---- ticks -------------------------------------------------------------
    const t6 = section("viewport.js — passo de tick 1-2-5");
    for (const [ppu, want] of [[60, 1], [30, 2], [12, 5], [6, 10], [300, 0.2], [120, 0.5]]) {
      const got = tickStep(ppu);
      row(t6, `pxPerUnit=${ppu}`, want, got, close(got, want));
    }

    document.getElementById("summary").innerHTML =
      `<span class="${fail ? "fail" : "ok"}">${pass} passaram, ${fail} falharam</span>`;
  </script>
</body>
</html>
